<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="Reloj y reuniones del día para trabajar sin distracciones.">
  <title>Focus</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/orbitron.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <span id="status" class="status" hidden></span>
      <button id="settings-btn" class="icon-btn" aria-label="Ajustes">⚙</button>
    </header>

    <section class="clock" id="clock" aria-live="off">
      <div class="time"><span id="hm">--:--</span><span id="sec" class="sec"></span><span id="ampm" class="sec"></span></div>
      <div id="date" class="date"></div>
      <div id="next" class="next" hidden></div>
      <div id="progress" class="progress" hidden></div>
      <a id="join" class="join" target="_blank" rel="noopener" hidden></a>
      <div class="focus-row">
        <span id="focus" class="focus" hidden></span>
        <button id="focus-btn" class="ghost" type="button" hidden></button>
      </div>
    </section>

    <section class="agenda">
      <h2>Hoy</h2>
      <button id="connect" class="primary" hidden>Conectar Google Calendar</button>
      <ul id="events" class="events"></ul>
      <p id="empty" class="muted" hidden>Sin reuniones el resto del día.</p>
      <p id="tomorrow" class="muted tomorrow" hidden></p>
    </section>
  </main>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>Ajustes</h2>
      <label>
        Google OAuth Client ID
        <input id="client-id" type="text" autocomplete="off" spellcheck="false"
               placeholder="xxxxxxxx.apps.googleusercontent.com">
      </label>
      <label class="row">
        <input id="wake" type="checkbox" checked>
        Mantener la pantalla encendida
      </label>
      <label class="row">
        <input id="seconds" type="checkbox" checked>
        Mostrar segundos
      </label>
      <label class="row">
        <input id="h24" type="checkbox">
        Formato 24 horas
      </label>
      <label>
        Avisar antes de cada reunión
        <select id="alert-min">
          <option value="0">No avisar</option>
          <option value="1">1 minuto antes</option>
          <option value="2">2 minutos antes</option>
          <option value="5">5 minutos antes</option>
          <option value="10">10 minutos antes</option>
        </select>
      </label>
      <label class="row">
        <input id="sound" type="checkbox" checked>
        Sonido en los avisos
      </label>
      <fieldset>
        <legend>Calendarios</legend>
        <div id="calendars" class="calendars"></div>
      </fieldset>
      <label class="row">
        <input id="night" type="checkbox" checked>
        Atenuar de noche
      </label>
      <div class="night-range">
        <label>Desde <input id="night-from" type="time" value="22:00"></label>
        <label>Hasta <input id="night-to" type="time" value="07:00"></label>
      </div>
      <div class="actions">
        <button type="button" id="disconnect" class="ghost">Desconectar</button>
        <button value="save" class="primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="details">
    <form method="dialog" class="settings details">
      <h2 id="d-title"></h2>
      <p id="d-when" class="muted"></p>
      <p id="d-location" class="muted" hidden></p>
      <a id="d-link" class="join" target="_blank" rel="noopener" hidden>Unirse a la reunión</a>
      <p id="d-desc" class="desc" hidden></p>
      <ul id="d-attendees" class="attendees" hidden></ul>
      <div class="actions"><span></span><button value="close" class="primary" autofocus>Cerrar</button></div>
    </form>
  </dialog>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="app.js"></script>
</body>
</html>
